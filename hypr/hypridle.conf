general {
    lock_cmd = qs -c lockscreen ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
  timeout = 600
  on-timeout = wlr-randr --output eDP-1 --off
  on-resume = wlr-randr --output eDP-1 --on
}
