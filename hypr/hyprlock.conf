background {
    monitor =
    path = /home/nanoarch/Pictures/Wallpapers/whoallpaper4.png
    color = rgba(11, 19, 43, 1.0)
    blur_passes = 3 
    blur_size = 2  
    noise = 0.0123 
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.1696
}

image {
    monitor =
    path = /home/nanoarch/Pictures/avatar/avatar3.jpg
    size = 300
    rounding = -1
    border_size = 4
    border_color = rgba(27, 27, 48, 0.65)
    position = 0,80 
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -2
    rounding = 10
    blur_passes = 1
    blur_sizer = 1
    #outer_color = 72A3E0
    outer_color = 0x00000000
    #inner_color = rgb(10, 12, 16)
    inner_color = rgba(27, 27, 48, 0.65)
    font_color = rgb(230, 235, 245)
    fade_on_empty = false
    fade_timeout = 10000
    placeholder_text = <span foreground="##8C7AE6">What is it</span>
    check_color = rgb(23, 23, 35)
    fail_color = rgb(255,0,0)
    fail_text = <i>Oops wrong !!($ATTEMPTS)</i>
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor = 
    text = cmd[update:1000] echo "<span>$(date '+%H:%M:%S')</span>"
    font_size = 57
